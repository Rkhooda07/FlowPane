<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowPane</title>
</head>

<body>
  <div id="app">
    <header class="title-bar" data-tauri-drag-region>
      <div class="window-controls">
        <button class="control-btn btn-close" id="close-btn" title="Close"></button>
        <button class="control-btn btn-minimize" id="minimize-btn" title="Minimize"></button>
        <button class="control-btn btn-maximize" id="maximize-btn" title="Maximize"></button>
      </div>
      <h1 class="navbar-home-link" id="main-home-link" role="button" tabindex="0" data-tauri-drag-region>FlowPane<span class="navbar-timer hidden"></span></h1>
      <div class="fold-guide" title="Drag to screen edges to collapse">
        <div class="guide-icon">
          <span></span><span></span><span></span><span></span>
        </div>
        <span class="guide-text">Drag to Snap</span>
      </div>
      <div class="action-controls notes-action-controls">
        <button class="control-btn btn-exit" id="notes-nav-exit-btn" title="Exit Notes">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>
            <polyline points="15 17 20 12 15 7"></polyline>
            <line x1="20" y1="12" x2="10" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <div class="input-area">
      <div class="task-input-shell">
        <input type="text" id="task-input" placeholder="What's next?" autocomplete="off" autocapitalize="sentences" />
        <div class="task-notes-icons" aria-hidden="true">
          <span class="task-note-tab note-1"></span>
          <span class="task-note-tab note-2"></span>
          <span class="task-note-tab note-3"></span>
          <span class="task-note-tab note-4"></span>
        </div>
      </div>
      <div class="due-container">
        <input type="text" id="due-input" placeholder="Date & Time (e.g. 01/30 12:00 PM)" />
        <div class="quick-time-presets">
          <button type="button" class="quick-time-btn" data-minutes="15">
            <span class="btn-text">+15m</span>
            <span class="btn-icon">✓</span>
          </button>
          <button type="button" class="quick-time-btn" data-minutes="30">
            <span class="btn-text">+30m</span>
            <span class="btn-icon">✓</span>
          </button>
          <button type="button" class="quick-time-btn" data-minutes="60">
            <span class="btn-text">+1h</span>
            <span class="btn-icon">✓</span>
          </button>
        </div>
      </div>
    </div>

    <div id="notes-workspace" class="notes-workspace hidden" aria-hidden="true">
      <div class="notes-editor-shell">
        <input
          type="text"
          id="notes-title-input"
          class="notes-title-input"
          placeholder="Note title"
          autocomplete="off"
          autocapitalize="sentences"
        />
        <textarea
          id="notes-body-editor"
          class="notes-body-editor"
          spellcheck="false"
          placeholder="Write your note..."
          autocapitalize="sentences"
        ></textarea>
      </div>
    </div>

    <div id="history-workspace" class="history-workspace hidden" aria-hidden="true">
      <div class="history-content-shell">
        <div class="history-header">
          <h2>Completed Tasks</h2>
          <button id="clear-history-btn" class="clear-history-btn" title="Clear All History">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
            Clear All
          </button>
        </div>
        <ul id="history-list" class="history-list">
          <!-- Completed tasks will be injected here -->
        </ul>
        <div id="history-empty-state" class="history-empty-state">
          <p>Your finished tasks will appear here ✨</p>
        </div>
      </div>
    </div>

    <div id="delete-confirm-modal" class="delete-confirm-modal hidden" aria-hidden="true">
      <div class="delete-confirm-card">
        <h3 id="delete-confirm-title">Delete item?</h3>
        <p id="delete-confirm-text">Are you sure you want to remove this item?</p>
        <label class="delete-confirm-checkbox-wrap">
          <input type="checkbox" id="delete-confirm-never-again" />
          <span>Don't ask again</span>
        </label>
        <div class="delete-confirm-actions">
          <button id="delete-confirm-cancel" class="modal-btn cancel">Cancel</button>
          <button id="delete-confirm-yes" class="modal-btn start">Delete</button>
        </div>
      </div>
    </div>

    <main class="task-container">
      <div class="list-filter" id="list-filter">
        <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path>
        </svg>
        <div class="filter-options">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="tasks">Tasks</button>
          <button class="filter-btn" data-filter="notes">Notes</button>
        </div>
        <button class="history-btn" id="history-btn" title="View History">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M12 7v5l4 2"></path>
          </svg>
        </button>
      </div>
      <ul class="task-list" id="task-list">
        <!-- Tasks will be injected here -->
      </ul>
    </main>

    <div id="focus-mode" class="focus-mode hidden">
      <header class="title-bar focus-header-bar" data-tauri-drag-region>
        <div class="window-controls">
          <button class="control-btn btn-close" id="focus-close-btn" title="Close"></button>
          <button class="control-btn btn-minimize" id="focus-minimize-btn" title="Minimize"></button>
          <button class="control-btn btn-maximize" id="focus-maximize-btn" title="Maximize"></button>
        </div>
        <h1 class="navbar-home-link" id="focus-home-link" role="button" tabindex="0" data-tauri-drag-region>FlowPane<span class="navbar-timer hidden"></span></h1>
        <div class="action-controls">
          <button class="control-btn btn-complete" id="focus-nav-complete-btn" title="Complete Task">✓</button>
          <button class="control-btn btn-exit" id="focus-nav-exit-btn" title="Exit Focus Mode">×</button>
        </div>
      </header>



      <div class="focus-content">
        <h2 id="focus-task-name">Active Task</h2>
        <div class="focus-timer">
          <span id="timer-display">00:00:00</span>
        </div>
        <p id="focus-quote" class="focus-quote"></p>
      </div>

      <div class="focus-bottom-controls">
        <button id="timer-settings-btn" class="round-btn timer-util" title="Timer Settings">⏱</button>
        <button id="timer-toggle-btn" class="round-btn play-pause" title="Play/Pause">
          <span id="play-icon">▶</span>
          <span id="pause-icon" class="hidden">⏸</span>
        </button>
        <button id="timer-reset-btn" class="round-btn reset" title="Reset Timer">↺</button>
      </div>

      <!-- Timer Settings Modal -->
      <div id="timer-modal" class="timer-modal hidden">
        <div class="timer-modal-content">
          <h3>Set Timer</h3>
          <div class="timer-input-group">
            <input type="number" id="timer-input-minutes" placeholder="25" min="1" max="180">
            <span>min</span>
          </div>
          <div class="timer-modal-actions">
            <button id="timer-cancel-btn" class="modal-btn cancel">Cancel</button>
            <button id="timer-start-btn" class="modal-btn start">Start</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Resize handles for frameless window -->
    <div class="resize-handle n"></div>
    <div class="resize-handle s"></div>
    <div class="resize-handle e"></div>
    <div class="resize-handle w"></div>
    <div class="resize-handle nw"></div>
    <div class="resize-handle ne"></div>
    <div class="resize-handle sw"></div>
    <div class="resize-handle se"></div>
  </div>

  <script type="module" src="/main.js"></script>
</body>

</html>
