<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="css/fonts.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowPane Bubble</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none !important;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      position: relative;
    }

    .eye-bubble.v3 {
      position: absolute;
      top: 120px;
      right: 24px;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      display: flex !important;
      transform-origin: center center;
    }

    .thought-dot {
      opacity: 0;
      transform: scale(0);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
    }

    .eye-bubble.v3.visible .thought-dot {
      opacity: 1;
      transform: scale(1);
    }

    .eye-bubble.v3.visible .d3 { transition-delay: 0s; }
    .eye-bubble.v3.visible .d2 { transition-delay: 0.1s; }
    .eye-bubble.v3.visible .d1 { transition-delay: 0.2s; }

    @keyframes bubbleCloudPopIn {
      0% { opacity: 0; transform: scale(0.8) translateY(5px); }
      65% { transform: scale(1.02) translateY(-1px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes bubblePopOut {
      0% { opacity: 1; transform: scale(1); }
      40% { transform: scale(1.05); }
      100% { opacity: 0; transform: scale(0.6); }
    }

    .thought-bubble-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 210px;
      min-height: 142px;
      padding: 14px 25px 14px 10px;
      border: 30px solid transparent;
      margin: -30px;
      filter: drop-shadow(4px 4px 0px #000);
      box-sizing: border-box;
      opacity: 0;
      overflow: visible !important;
    }

    .eye-bubble.v3.visible .thought-bubble-container {
      animation: bubbleCloudPopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
    }

    .thought-bubble-svg {
      position: absolute;
      top: -20px;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      transform: scale(-1, -1);
      transform-origin: center;
      overflow: visible;
    }

    .bubble-path,
    .thought-dot {
      fill: white;
      stroke: black;
      stroke-width: 2.2;
    }

    .bubble-text {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #000;
      text-transform: lowercase;
      font-style: italic;
      white-space: normal;
      letter-spacing: -0.3px;
      z-index: 2;
      max-width: 100px;
      margin-top: -34px;
      margin-right: 15px;
      margin-left: 0;
      line-height: 1.1;
      text-align: center;
      text-wrap: balance;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .eye-bubble.v3.visible {
      opacity: 1;
    }

    .eye-bubble.v3.burst-out {
      animation: bubblePopOut 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .eye-bubble.v3.hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="eye-bubble v3 hidden" aria-hidden="true">
    <div class="thought-bubble-container">
      <svg class="thought-bubble-svg" viewBox="0 0 120 120" preserveAspectRatio="none">
        <path class="bubble-path" d="M30,30 C30,10 45,5 55,10 C65,0 85,0 95,10 C110,5 125,15 120,35 C130,45 130,75 115,85 C115,100 95,105 80,95 C70,105 50,105 40,95 C25,105 10,95 15,80 C5,70 5,45 20,40 C15,30 20,15 30,30 Z" />
        <circle class="thought-dot d1" cx="35" cy="100" r="7" />
        <circle class="thought-dot d2" cx="25" cy="110" r="4.5" />
        <circle class="thought-dot d3" cx="18" cy="117" r="2.5" />
      </svg>
      <span class="bubble-text"></span>
    </div>
  </div>

  <script>
    const bubble = document.querySelector('.eye-bubble');
    const bubbleText = document.querySelector('.bubble-text');
    const timers = new Set();
    let lastShowAt = 0;

    function schedule(callback, delay) {
      const timer = setTimeout(() => {
        timers.delete(timer);
        callback();
      }, delay);
      timers.add(timer);
      return timer;
    }

    function clearTimers() {
      timers.forEach((timer) => clearTimeout(timer));
      timers.clear();
    }

    function resetBubble() {
      clearTimers();
      bubble.classList.remove('visible', 'burst-out');
      bubble.classList.add('hidden');
      bubbleText.innerHTML = '';
    }

    function tokenizeBubbleHTML(fullHTML) {
      const tokens = [];
      for (let i = 0; i < fullHTML.length; i++) {
        if (fullHTML.startsWith('<br>', i)) {
          tokens.push('<br>');
          i += 3;
        } else {
          tokens.push(fullHTML[i]);
        }
      }
      return tokens;
    }

    function renderBubbleTokens(tokens, count) {
      return tokens.slice(0, count).join('');
    }

    function typeTextForward(tokens) {
      let typeIndex = 0;

      const timer = setInterval(() => {
        if (!bubble.classList.contains('visible')) {
          clearInterval(timer);
          timers.delete(timer);
          return;
        }

        typeIndex++;
        bubbleText.innerHTML = renderBubbleTokens(tokens, typeIndex);

        if (typeIndex >= tokens.length) {
          clearInterval(timer);
          timers.delete(timer);
        }
      }, 30);

      timers.add(timer);
    }

    function typeTextAway(tokens) {
      let currentLen = tokens.length;

      const timer = setInterval(() => {
        currentLen--;
        if (currentLen < 0) {
          clearInterval(timer);
          timers.delete(timer);
          bubble.classList.remove('visible');
          bubble.classList.add('burst-out');
          schedule(resetBubble, 400);
          return;
        }

        bubbleText.innerHTML = renderBubbleTokens(tokens, currentLen);
      }, 30);

      timers.add(timer);
    }

    function showBubble(payload = {}) {
      const now = performance.now();
      if (now - lastShowAt < 100) return;
      lastShowAt = now;
      const fullHTML = payload.html || 'i got my<br>eyes on you';
      const durationMs = payload.durationMs || 3000;
      const tokens = tokenizeBubbleHTML(fullHTML);

      resetBubble();
      bubble.classList.remove('hidden', 'burst-out');

      schedule(() => {
        bubble.classList.add('visible');
        schedule(() => typeTextForward(tokens), 350);
      }, 50);

      schedule(() => typeTextAway(tokens), durationMs);
    }

    window.showEyeBubbleFromHost = showBubble;
    window.hideEyeBubbleFromHost = resetBubble;

    window.__TAURI__.event.listen('eye-bubble:show', showBubble);
    window.__TAURI__.event.listen('eye-bubble:hide', resetBubble);
  </script>
</body>

</html>
